title: "相見不如懷念  :: [ the long ver. ]"
author: Jeff Wu
email: hello@jeffwu.com
description: A digital junk drawer for the modern polymath.
url: https://jeffwu.com
baseurl: ""
repository: wuj/wuj.github.io
theme: minima
header_pages: []
show_excerpts: true
permalink: /:year/:slug/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Jeff Wu
  - scope:
      path: ""
      type: pages
    values:
      layout: page
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  - "*.code-workspace"
  - AGENTS.md
  - CLAUDE.md
  - docs
  - books
  - README.md
  - LICENSE
