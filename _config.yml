title: 相見不如懷念 / the long version
author: Jeff Wu
email: your-email@example.com
description: A digital junk drawer for the modern polymath.
url: https://wuj.github.io
repository: wuj/wuj.github.io
theme: minima
header_pages: []
permalink: /:year/:slug/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Jeff Wu
  - scope:
      path: ""
      type: pages
    values:
      layout: page
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  - "*.code-workspace"
  - AGENTS.md
  - CLAUDE.md
  - docs
  - README.md
  - LICENSE
