title: "jeffwu.com:~/latent_space$"
author: Jeff Wu
email: hello@jeffwu.com
description: A digital junk drawer for the modern polymath.
url: https://jeffwu.com
baseurl: ""
repository: wuj/wuj.github.io
theme: minima
header_pages: []
show_excerpts: true
permalink: /:slug/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
cusdis:
  app_id: "70d81261-8335-4c8a-828f-f94f6cb08d1d"
  host: "https://cusdis.com"
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post-with-comments
      author: Jeff Wu
  - scope:
      path: ""
      type: pages
    values:
      layout: page
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  - "*.code-workspace"
  - AGENTS.md
  - CLAUDE.md
  - docs
  - books
  - lectures
  - README.md
  - LICENSE
